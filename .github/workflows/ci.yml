name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: 22

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          retention-days: 1
          include-hidden-files: true
          path: |
            core/core/dist
            core/compiler/dist
            core/config-loader/dist
            core/inkline/dist
            core/plugin/dist
            tooling/cli/dist
            tooling/storybook/dist
            tooling/test-utils/dist
            ui/*/.inkline
            ui/*/.styleframe

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Build storybook
        run: pnpm --filter @inkline/storybook-app run storybook:build
        env:
          NODE_ENV: production

      - name: Upload storybook build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-build
          path: apps/storybook/dist
          retention-days: 1

  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      # `generate`, not `build`: the site ships as a fully prerendered static
      # bundle (docs/adrs/007-website-ships-as-a-static-site.md). Only `generate`
      # emits robots.txt, sitemap.xml, 200.html and 404.html, so building the
      # other way would leave CI green while the deploy artifact is missing
      # exactly the files the deploy needs.
      - name: Build website
        run: pnpm --filter website run generate
        env:
          NODE_ENV: production

      # Consumes the artifact the step above produced, which is why it lives
      # here and not in the `test` job — that job never builds the website.
      #
      # Checks the static site: every docs URL prerendered as a file, plus
      # llms.txt, sitemap.xml, robots.txt, 200.html and 404.html, and no Docus
      # assistant endpoint anywhere in it (test/site.build.test.ts).
      - name: Check generated site
        run: pnpm --filter website run test:build

      # `.output/public` is `generate`'s real output. The previous path,
      # `apps/docs/dist`, is an untracked symlink Nuxt only creates on
      # `generate` — under `build` it never existed and this artifact uploaded
      # nothing.
      - name: Upload website build
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: apps/docs/.output/public
          include-hidden-files: true
          retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Run oxlint
        run: npx vp lint

      - name: Check formatting
        run: npx vp fmt --check

  # Deliberately does not reuse the `build` artifacts. Package types resolve through each package's
  # `exports` into `dist/`, so a check run against someone else's `dist` is only as trustworthy as
  # the coupling that delivered it — and the same check run locally against a stale `dist` reports
  # success on the pre-change types. `pnpm run typecheck` builds first, which makes that impossible
  # and makes this job byte-identical to what a contributor runs. It costs one extra build, in
  # parallel with `build` rather than after it, so wall-clock is roughly unchanged.
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checking
        run: pnpm run typecheck

  test:
    name: Unit Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Run tests
        # Each shard runs only part of the suite, so per-package coverage is partial. Disable the
        # 100% coverage thresholds for the sharded run (Codecov merges the two shard uploads); the
        # gate still applies to full local `vp test --coverage` runs. A CLI flag is used rather than
        # an env var because `vp run` executes tasks in a clean environment that strips ad-hoc vars.
        run: >-
          pnpm run test --
          --coverage --shard=${{ matrix.shard }}/2 --passWithNoTests
          --coverage.thresholds.lines=0 --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0 --coverage.thresholds.statements=0
        env:
          NODE_ENV: test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: shard-${{ matrix.shard }}

  visual-parity:
    name: Visual Parity (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: build
    # Blocking: listed in `ci-success.needs` below. Parity is green and deterministic across all seven
    # targets, so a diff here is a real regression and fails the pipeline. The uploaded Playwright report
    # + diff images remain available as artifacts for triage.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The composition Storybook runs in dev mode, where each framework package is aliased to its
      # generated `.inkline` source (tooling/storybook preset) — so the build artifact's `ui/*/.inkline`
      # + `.styleframe` is all that's needed; `ui/*/dist` is not.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Install Playwright Chromium
        run: pnpm --filter @inkline/e2e exec playwright install --with-deps chromium

      # No NODE_ENV=production: the per-framework dev servers must keep the source alias active.
      - name: Run visual parity tests
        run: pnpm --filter @inkline/e2e run test:e2e
        env:
          STORY_SHARD: ${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-parity-report-shard-${{ matrix.shard }}
          path: |
            testing/e2e/playwright-report
            testing/e2e/test-results
          retention-days: 7

  # Builds each framework Storybook the way its Cloudflare Worker deploys it, so a broken one fails
  # the PR instead of the deploy. It does not reuse the `build` artifacts: a static Storybook imports
  # the package's real `dist/` (tooling/storybook preset), which the artifact does not carry, so each
  # job builds its own package and the packages it depends on.
  build-framework-storybooks:
    name: Build Storybook (${{ matrix.framework }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [react, vue, svelte, solid, angular, qwik, astro]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm --filter "@inkline/${{ matrix.framework }}..." build

      - name: Build storybook
        run: pnpm --filter "@inkline/${{ matrix.framework }}" run storybook:build

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      [
        build,
        build-storybook,
        build-website,
        lint,
        typecheck,
        test,
        visual-parity,
        build-framework-storybooks,
      ]
    if: always()
    steps:
      # `skipped` stays allowed, so a needed job that gains a job-level `if:` later
      # doesn't fail the pipeline whenever it skips.
      - name: Check job status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
