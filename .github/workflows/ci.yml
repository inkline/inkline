name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# `main` gets one group per commit, so every commit gets its own verdict. Sharing a
# group across main commits does not just serialize them: `cancel-in-progress: false`
# makes a run sit *pending* behind the running one, and GitHub cancels an existing
# pending run whenever a newer one is queued into the same group. A merge then lands
# with no CI verdict at all and its breakage first shows up on the innocent commit
# after it — which is exactly how UXF-221 happened (run 33042055422, 0 jobs, cancelled
# one second after the next push). PR branches keep one group per ref, where
# superseding a stale run is the point.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: 22

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          retention-days: 1
          include-hidden-files: true
          path: |
            core/core/dist
            core/compiler/dist
            core/config-loader/dist
            core/inkline/dist
            core/plugin/dist
            tooling/cli/dist
            tooling/storybook/dist
            tooling/test-utils/dist
            ui/*/.inkline
            ui/*/.styleframe

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Build storybook
        run: pnpm --filter @inkline/storybook-app run storybook:build
        env:
          NODE_ENV: production

      - name: Upload storybook build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-build
          path: apps/storybook/dist
          retention-days: 1

  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      # `generate`, not `build`: the site ships as a fully prerendered static
      # bundle (docs/adrs/007-website-ships-as-a-static-site.md). Only `generate`
      # emits robots.txt, sitemap.xml, 200.html and 404.html, so building the
      # other way would leave CI green while the deploy artifact is missing
      # exactly the files the deploy needs.
      - name: Build website
        run: pnpm --filter website run generate
        env:
          NODE_ENV: production

      # Consumes the artifact the step above produced, which is why it lives
      # here and not in the `test` job — that job never builds the website.
      #
      # Guards the single-Tailwind-pass invariant: the layer's base CSS and the
      # app's brand CSS must reach the bundle as ONE entry. Two entries emit a
      # duplicate of every utility (437,170 B raw / 55,295 B gzip against
      # 224,261 B / 28,573 B when this last shipped here — UXF-118); zero
      # entries ship no utilities at all. The guard asserts exactly one, so it
      # catches both.
      - name: Guard compiled CSS (single Tailwind pass)
        run: pnpm --filter website run test:build

      # `.output/public` is `generate`'s real output. The previous path,
      # `apps/website/dist`, is an untracked symlink Nuxt only creates on
      # `generate` — under `build` it never existed and this artifact uploaded
      # nothing.
      - name: Upload website build
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: apps/website/.output/public
          include-hidden-files: true
          retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Run oxlint
        run: npx vp lint

      - name: Check formatting
        run: npx vp fmt --check

  # Deliberately does not reuse the `build` artifacts. Package types resolve through each package's
  # `exports` into `dist/`, so a check run against someone else's `dist` is only as trustworthy as
  # the coupling that delivered it — and the same check run locally against a stale `dist` reports
  # success on the pre-change types. `pnpm run typecheck` builds first, which makes that impossible
  # and makes this job byte-identical to what a contributor runs. It costs one extra build, in
  # parallel with `build` rather than after it, so wall-clock is roughly unchanged.
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checking
        run: pnpm run typecheck

  test:
    name: Unit Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Run tests
        # Each shard runs only part of the suite, so per-package coverage is partial. Disable the
        # 100% coverage thresholds for the sharded run (Codecov merges the two shard uploads); the
        # gate still applies to full local `vp test --coverage` runs. A CLI flag is used rather than
        # an env var because `vp run` executes tasks in a clean environment that strips ad-hoc vars.
        run: >-
          pnpm run test --
          --coverage --shard=${{ matrix.shard }}/2 --passWithNoTests
          --coverage.thresholds.lines=0 --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0 --coverage.thresholds.statements=0
        env:
          NODE_ENV: test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: shard-${{ matrix.shard }}

  visual-parity:
    name: Visual Parity (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: build
    # Blocking: listed in `ci-success.needs` below. Parity is green and deterministic across all seven
    # targets, so a diff here is a real regression and fails the pipeline. The uploaded Playwright report
    # + diff images remain available as artifacts for triage.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The composition Storybook runs in dev mode, where each framework package is aliased to its
      # generated `.inkline` source (tooling/storybook preset) — so the build artifact's `ui/*/.inkline`
      # + `.styleframe` is all that's needed; `ui/*/dist` is not.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Install Playwright Chromium
        run: pnpm --filter @inkline/e2e exec playwright install --with-deps chromium

      # No NODE_ENV=production: the per-framework dev servers must keep the source alias active.
      - name: Run visual parity tests
        run: pnpm --filter @inkline/e2e run test:e2e
        env:
          STORY_SHARD: ${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-parity-report-shard-${{ matrix.shard }}
          path: |
            testing/e2e/playwright-report
            testing/e2e/test-results
          retention-days: 7

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [build, build-storybook, build-website, lint, typecheck, test, visual-parity]
    if: always()
    steps:
      - name: Check job status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            exit 1
          fi

  # A red `main` emitted no signal at all: the only way to see one was to open the
  # Actions tab, so UXF-221 sat red for ~2h before anyone noticed. This pushes the
  # failure onto the issue board, which is where the work is already tracked. One
  # open issue holds all of it — later failures comment on it rather than filing
  # duplicates — so closing the issue is the deliberate "main is green again" act.
  notify-main-failure:
    name: Notify on red main
    runs-on: ubuntu-latest
    needs: ci-success
    if: ${{ always() && needs.ci-success.result == 'failure' && github.event_name == 'push' }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update the red-main issue
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'ci: red main';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `CI failed on \`main\`.`,
              ``,
              `- Commit: ${context.sha}`,
              `- Run: ${runUrl}`,
              ``,
              `A red \`main\` is an incident: revert the breaking commit, then land the fix through a normal PR.`,
              `Close this issue once \`main\` is green again.`,
            ].join('\n');

            const open = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: open.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: `CI is failing on main (${context.sha.slice(0, 7)})`,
                labels: [label],
                body,
              });
            }
